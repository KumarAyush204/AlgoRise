name: CI
on: [push, pull_request]

jobs:
  CI_HEALTH_CHECK:
    runs-on: ubuntu-latest
    services:
      supabase:
        image: supabase/postgres:15.14.1.013 # Supabase Postgres image
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: algoRise
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/algoRise"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Supabase Postgres
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -U postgres; then
              echo "✅ Supabase Postgres is ready"
              break
            fi
            echo "⏳ Waiting for Supabase Postgres..."
            sleep 2
          done

      - name: Setup database schema
        run: psql $DATABASE_URL -f SUPABASE_SETUP.sql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure essential tables exist
        run: |
          REQUIRED_TABLES=("streaks" "cf_handles" "cf_snapshots")
          for tbl in "${REQUIRED_TABLES[@]}"; do
            exists=$(psql -t -A $DATABASE_URL -c "SELECT to_regclass('public.$tbl');" | xargs)
            if [ -z "$exists" ] || [ "$exists" = "null" ]; then
              echo "❌ Table $tbl is missing!"
              exit 1
            else
              echo "✅ Table $tbl exists."
            fi
          done
