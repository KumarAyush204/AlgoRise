name: CI
on: [push,pull_request]
jobs:
  CI_HEALTH_CHECK: 
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: algoRise
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/algoRise"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done
      
      - name: Setup database schema
        run: psql $DATABASE_URL -f SUPABASE_SETUP.sql
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify created tables
        run: |
          echo "Verifying that all expected tables exist..."
          TABLE_LIST=$(psql $DATABASE_URL -c "\dt public.*")
          
          echo "$TABLE_LIST" | grep -q 'streaks' && echo "✅ Table 'streaks' found." || { echo "❌ Table 'streaks' NOT found!"; exit 1; }
          echo "$TABLE_LIST" | grep -q 'cf_handles' && echo "✅ Table 'cf_handles' found." || { echo "❌ Table 'cf_handles' NOT found!"; exit 1; }
          echo "$TABLE_LIST" | grep -q 'cf_snapshots' && echo "✅ Table 'cf_snapshots' found." || { echo "❌ Table 'cf_snapshots' NOT found!"; exit 1; }

